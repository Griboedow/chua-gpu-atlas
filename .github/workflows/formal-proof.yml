name: Formal tangency proof

on:
  push:
    paths: ["formal/**", "research/check_chua_formal.py", ".github/workflows/formal-proof.yml"]
  pull_request:
    paths: ["formal/**", "research/check_chua_formal.py", ".github/workflows/formal-proof.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: formal
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
      - name: Fetch only the imported Mathlib cache
        working-directory: formal
        run: lake exe cache get Mathlib.Analysis.Calculus.LocalExtr.Rolle Mathlib.Analysis.Calculus.Deriv.Slope Mathlib.Topology.Order.Compact Mathlib.Tactic.Linarith Mathlib.Tactic.NormNum Mathlib.Data.Real.Basic
      - name: Check axioms and rejection controls
        run: python3 research/check_chua_formal.py --output /tmp/chua-formal-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: formal-check
          path: /tmp/chua-formal-check.json
